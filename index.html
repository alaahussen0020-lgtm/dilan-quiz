:root{--beige:#F5EFE3;--ink:#1F1F1F;--red:#DD0000;--gold:#FFCE00;--muted:#7a6f60;--card:#fffdf8;
--der:#1e64d2;--die:#d71e28;--das:#149646;--ok:#149646;--bad:#d71e28}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Vaz,system-ui,sans-serif;background:var(--beige);color:var(--ink);overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.16;animation:drift 18s ease-in-out infinite alternate}
.bg i:nth-child(1){width:340px;height:340px;background:var(--red);top:-80px;right:-60px}
.bg i:nth-child(2){width:420px;height:420px;background:var(--gold);bottom:-120px;left:-100px;animation-duration:24s;opacity:.24}
@keyframes drift{to{transform:translate(40px,30px) scale(1.1)}}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 40px}
.de{direction:ltr;unicode-bidi:isolate;font-family:Vaz,system-ui,sans-serif}
header{text-align:center;margin:10px 0 22px}
.ded{display:inline-block;font-weight:700;font-size:15px;color:#fff;background:var(--red);padding:5px 16px;border-radius:99px;margin-bottom:12px}
h1{font-size:28px;line-height:1.4}
.sub{color:var(--muted);font-size:15px;margin-top:4px}
.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 6px 24px rgba(60,40,10,.08);margin-bottom:14px}
.label{font-size:14px;color:var(--muted);font-weight:700;margin-bottom:10px}
.modes{display:grid;gap:10px}
.mode{display:flex;align-items:center;gap:14px;width:100%;border:2px solid transparent;background:#f8f3e9;border-radius:16px;padding:14px;font:inherit;text-align:right;cursor:pointer;transition:transform .15s,border-color .15s}
.mode:hover{border-color:var(--gold)}.mode:active{transform:scale(.98)}
.mode .ic{flex:0 0 44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;font-weight:700;color:#fff}
.mode b{display:block;font-size:17px}.mode small{display:block;color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid #e6dccb;background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.best{text-align:center;color:var(--muted);font-size:14px;margin-top:6px}
/* quiz */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.x{border:0;background:#fff;width:40px;height:40px;border-radius:12px;font-size:20px;cursor:pointer}
.bar{flex:1;height:10px;background:#e8dfcf;border-radius:9px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--red);border-radius:9px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.count{font-weight:700;font-size:15px;min-width:52px;text-align:left}
.q{text-align:center;padding:26px 18px;animation:up .45s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.qtype{font-size:14px;color:var(--muted);font-weight:700}
.big{font-size:42px;font-weight:700;line-height:1.3;margin:12px 0 4px;word-break:break-word}
.big.ku{font-size:38px}
.play{border:0;background:var(--gold);width:64px;height:64px;border-radius:50%;cursor:pointer;display:inline-grid;place-items:center;margin-top:10px;box-shadow:0 4px 14px rgba(255,206,0,.45);transition:transform .15s}
.play:active{transform:scale(.92)}.play svg{width:28px;height:28px}
.play.huge{width:110px;height:110px;margin:18px 0 6px}.play.huge svg{width:46px;height:46px}
.play.sm{width:40px;height:40px;box-shadow:none;margin:0;flex:0 0 40px}.play.sm svg{width:18px;height:18px}
.opts{display:grid;gap:10px}
.opts.three{grid-template-columns:repeat(3,1fr);direction:ltr}
.opt{width:100%;border:2px solid #e6dccb;background:#fff;border-radius:16px;padding:15px 14px;font:inherit;font-size:20px;font-weight:700;cursor:pointer;transition:transform .12s,background .2s,border-color .2s;animation:up .4s cubic-bezier(.2,.8,.2,1) both}
.opt:nth-child(2){animation-delay:.05s}.opt:nth-child(3){animation-delay:.1s}.opt:nth-child(4){animation-delay:.15s}
.opt:hover:not(:disabled){border-color:var(--gold)}.opt:active:not(:disabled){transform:scale(.97)}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff;animation:shake .35s}
.opt:disabled{cursor:default}
.opt.dim{opacity:.45}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.art-der{color:var(--der)}.art-die{color:var(--die)}.art-das{color:var(--das)}
.opt.ok .art-der,.opt.ok .art-die,.opt.ok .art-das,.opt.bad .art-der,.opt.bad .art-die,.opt.bad .art-das{color:#fff}
.fb{min-height:64px;margin-top:14px;text-align:center}
.fbbox{display:inline-block;border-radius:14px;padding:10px 18px;font-weight:700;animation:up .3s}
.fbbox.ok{background:#e3f5e9;color:var(--ok)}.fbbox.bad{background:#fde6e7;color:var(--bad)}
.fbbox .de{display:block;font-size:20px;margin-top:2px;color:var(--ink)}
.next{width:100%;border:0;background:var(--ink);color:#fff;border-radius:16px;padding:16px;font:inherit;font-size:18px;font-weight:700;cursor:pointer;margin-top:12px}
.next:disabled{opacity:.25;cursor:default}
/* result */
.res{text-align:center;padding:28px 18px}
.ring{width:170px;height:170px;margin:6px auto 12px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;font-weight:700}
.msg{font-size:22px;font-weight:700;margin-bottom:4px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #eee5d6}
.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:0}
.row .t .de{font-weight:700;font-size:18px;text-align:right}
.row .t .ku{color:var(--muted);font-size:15px}
.btns{display:grid;gap:10px;margin-top:6px}
.ghost{width:100%;border:2px solid var(--ink);background:transparent;border-radius:16px;padding:14px;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
.sect{font-size:15px;font-weight:700;color:var(--red);margin:16px 0 4px}
.hide{display:none}
.share{display:block;text-align:center;text-decoration:none;color:#fff;border-radius:16px;padding:15px;font-size:17px;font-weight:700}
.share.wa{background:#1fa855}.share.tg{background:#2a9fd8}
</style>

AAAAAAAAAAAAAAAAAAAAAA", "data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYwLjE2LjEwMAAAAAAAAAAAAAAA//OEwAAAAAAAAAAAAEluZm8AAAAPAAAAAAAAAMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAExhdmM2MC4zMQAAAAAAAAAAAAAAAAAAAAAAAAAAAADAAADqMgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYwLjE2LjEwMAAAAAAAAAAAAAAA//OEwAAAAAAAAAAAAEluZm8AAAAPAAAAAAAAAMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAExhdmM2MC4zMQAAAAAAAAAAAAAAAAAAAAAAAAAAAADAAADqMgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYwLjE2LjEwMAAAAAAAAAAAAAAA//OEwAAAAAAAAAAAAEluZm8AAAAPAAAAAAAAAMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAExhdmM2MC4zMQAAAAAAAAAAAAAAAAAAAAAAAAAAAADAAADqMgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYwLjE2LjEwMAAAAAAAAAAAAAAA//OEwAAAAAAAAAAAAEluZm8AAAAPAAAAAAAAAMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAExhdmM2MC4zMQAAAAAAAAAAAAAAAAAAAAAAAAAAAADAAADqMgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYwLjE2LjEwMAAAAAAAAAAAAAAA//OEwAAAAAAAAAAAAEluZm8AAAAPAAAAAAAAAMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAExhdmM2MC4zMQAAAAAAAAAAAAAAAAAAAAAAAAAAAADAAADqMgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYwLjE2LjEwMAAAAAAAAAAAAAAA//OEwAAAAAAAAAAAAEluZm8AAAAPAAAAAAAAAMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAExhdmM2MC4zMQAAAAAAAAAAAAAAAAAAAAAAAAAAAADAAADqMgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYwLjE2LjEwMAAAAAAAAAAAAAAA//OEwAAAAAAAAAAAAEluZm8AAAAPAAAAAAAAAMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAExhdmM2MC4zMQAAAAAAAAAAAAAAAAAAAAAAAAAAAADAAADqMgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYwLjE2LjEwMAAAAAAAAAAAAAAA//OEwAAAAAAAAAAAAEluZm8AAAAPAAAAAAAAAMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAExhdmM2MC4zMQAAAAAAAAAAAAAAAAAAAAAAAAAAAADAAADqMgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYwLjE2LjEwMAAAAAAAAAAAAAAA//OEwAAAAAAAAAAAAEluZm8AAAAPAAAAAAAAAMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAExhdmM2MC4zMQAAAAAAAAAAAAAAAAAAAAAAAAAAAADAAADqMgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"];
const SECT=["سڵاوکردن و ماڵئاوایی", "وشەکانی ڕێز و وەڵامدانەوە", "ژمارەکان لە ١ تا ١٠", "خەڵک و خێزان", "خواردن و خواردنەوە", "شوێنەکان", "وشە پرسیارییەکان", "کارە سەرەکییەکان"];
const ICON='<svg viewBox="0 0 24 24" fill="#1F1F1F"><path d="M3 10v4a1 1 0 0 0 1 1h3l4 4V5L7 9H4a1 1 0 0 0-1 1zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
const app=document.getElementById('app');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* sound: Web Audio (works inside the sandboxed viewer), unlocked on the first tap; HTML audio from a blob as fallback */
let ctx=null,src=null,el=null;const BUF={},BLOB={};
function bytes(i){const b=atob(AUD[i].split(',')[1]);const u=new Uint8Array(b.length);for(let k=0;k<b.length;k++)u[k]=b.charCodeAt(k);return u}
function unlock(){try{if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)ctx=new AC()}
  if(ctx&&ctx.state!=='running'){ctx.resume();const s=ctx.createBufferSource();s.buffer=ctx.createBuffer(1,1,22050);s.connect(ctx.destination);s.start(0)}}catch(e){}}
document.addEventListener('pointerdown',unlock,true);document.addEventListener('touchend',unlock,true);document.addEventListener('click',unlock,true);
function decode(i){if(BUF[i])return BUF[i];const ab=bytes(i).buffer;
  BUF[i]=new Promise((res,rej)=>{const p=ctx.decodeAudioData(ab,res,rej);if(p&&p.then)p.then(res,rej)});return BUF[i]}
function fallback(i){try{if(!BLOB[i])BLOB[i]=URL.createObjectURL(new Blob([bytes(i)],{type:'audio/mpeg'}));
  if(!el)el=new Audio();el.pause();el.src=BLOB[i];const p=el.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
function play(i){unlock();
  if(!ctx){fallback(i);return}
  decode(i).then(buf=>{try{if(src)src.stop()}catch(e){}src=ctx.createBufferSource();src.buffer=buf;src.connect(ctx.destination);
    if(ctx.state!=='running')ctx.resume();src.start(0)}).catch(()=>{BUF[i]=null;fallback(i)})}
window.__soundTest=async i=>{unlock();try{const b=await decode(i);return b.duration}catch(e){return 'ERR '+e}};
function art(w){const m=w.de.match(/^(der|die|das) (.+)$/);return m?{a:m[1],n:m[2]}:null}
function deHTML(w){const m=art(w);return m?`<span class="art-${m.a}">${m.a}</span> ${esc(m.n)}`:esc(w.de)}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}

const MODES=[
 {id:'mix',t:'تاقیکردنەوەی تێکەڵ',d:'٢٠ پرسیار لە هەموو جۆرەکان',ic:'★',c:'var(--red)'},
 {id:'dk',t:'ئەڵمانی ← کوردی',d:'وشە ئەڵمانییەکە دەبینیت، واتاکەی هەڵدەبژێریت',ic:'A',c:'var(--ink)'},
 {id:'kd',t:'کوردی ← ئەڵمانی',d:'واتا کوردییەکە دەبینیت، وشە ئەڵمانییەکە هەڵدەبژێریت',ic:'ک',c:'#5a4a33'},
 {id:'hoeren',t:'گوێگرتن',d:'گوێ لە وشەکە دەگریت و واتاکەی هەڵدەبژێریت',ic:'♪',c:'#b58900'},
 {id:'art',t:'der / die / das',d:'ئامرازی دروستی ناوەکان هەڵبژێرە',ic:'d',c:'var(--der)'},
 {id:'list',t:'لیستی وشەکان',d:'پێش تاقیکردنەوە هەموو وشەکان ببینە و گوێیان لێ بگرە',ic:'☰',c:'var(--das)'}
];
let sel=new Set(SECT.map((_,i)=>i));

function home(){
  const best=store('dilan-best');
  app.innerHTML=`<header><div class="ded">تەنها بۆ خاتوو دیلان</div><h1>کوێزی وشە سەرەتاییەکان</h1><div class="sub">${W.length} وشەی یەکەمی زمانی ئەڵمانی</div></header>
  <div class="card"><div class="label">بەشەکان</div><div class="chips">${SECT.map((s,i)=>`<button class="chip ${sel.has(i)?'on':''}" data-s="${i}">${esc(s)}</button>`).join('')}</div></div>
  <div class="card"><div class="label">جۆری تاقیکردنەوە هەڵبژێرە</div><div class="modes">${MODES.map(m=>`<button class="mode" data-m="${m.id}"><span class="ic" style="background:${m.c}"><span class="de">${m.ic}</span></span><span><b>${m.id==='art'?'<span class="de">der / die / das</span>':esc(m.t)}</b><small>${esc(m.d)}</small></span></button>`).join('')}</div>
  ${best!=null?`<div class="best">باشترین ئەنجامت: ${best}٪</div>`:''}</div>`;
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const i=+b.dataset.s;if(sel.has(i)){if(sel.size>1)sel.delete(i)}else sel.add(i);home()});
  app.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{const m=b.dataset.m;m==='list'?list():start(m)});
  window.scrollTo(0,0);
}

function list(){
  let h=`<div class="top"><button class="x" id="back">→</button><div class="count"></div></div><div class="card">`;
  SECT.forEach((s,si)=>{if(!sel.has(si))return;h+=`<div class="sect">${esc(s)}</div>`;
    W.forEach((w,i)=>{if(w.s!==si)return;h+=`<div class="row"><button class="play sm" data-p="${i}">${ICON}</button><div class="t"><div class="de">${deHTML(w)}</div><div class="ku">${esc(w.ku)}</div></div></div>`})});
  app.innerHTML=h+`</div>`;
  app.querySelector('#back').onclick=home;
  app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>play(+b.dataset.p));
  window.scrollTo(0,0);
}

let Q=[],qi=0,score=0,wrong=[],LOG=[];
function pool(){return W.map((w,i)=>i).filter(i=>sel.has(W[i].s))}
function distract(i,key,n){
  const same=shuffle(W.map((_,j)=>j).filter(j=>j!==i&&W[j].s===W[i].s));
  const other=shuffle(W.map((_,j)=>j).filter(j=>j!==i&&W[j].s!==W[i].s));
  const out=[],seen=new Set([W[i][key]]);
  for(const j of same.concat(other)){if(out.length>=n)break;if(!seen.has(W[j][key])){seen.add(W[j][key]);out.push(j)}}
  return out;
}
function make(type,i){
  if(type==='art'){const m=art(W[i]);return{type,i,opts:['der','die','das'],ans:m.a}}
  const key=type==='kd'?'de':'ku';
  const opts=shuffle([i,...distract(i,key,3)]);return{type,i,opts,ans:i};
}
function start(mode,only){
  let ids=only||pool();
  const nouns=ids.filter(i=>art(W[i]));
  let qs=[];
  if(mode==='art'){if(!nouns.length){alertBox();return}qs=shuffle(nouns).slice(0,15).map(i=>make('art',i))}
  else if(mode==='mix'){qs=shuffle(ids).slice(0,only?ids.length:20).map(i=>{const t=shuffle(art(W[i])?['dk','kd','hoeren','art']:['dk','kd','hoeren'])[0];return make(t,i)})}
  else qs=shuffle(ids).slice(0,only?ids.length:15).map(i=>make(mode,i));
  Q=qs;qi=0;score=0;wrong=[];LOG=[];Q.mode=mode;ask();
}
function alertBox(){app.insertAdjacentHTML('afterbegin','<div class="card" style="text-align:center">لەو بەشانەی هەڵتبژاردوون هیچ ناوێک بە der/die/das نییە.</div>')}

const TYPE_LABEL={dk:'واتای ئەم وشەیە چییە؟',kd:'ئەم وشەیە بە ئەڵمانی چییە؟',hoeren:'گوێ بگرە و واتاکەی هەڵبژێرە',art:'ئامرازی ئەم ناوە کامەیە؟'};
function ask(){
  const q=Q[qi],w=W[q.i];
  let stem='';
  if(q.type==='dk')stem=`<div class="big de">${deHTML(w)}</div><button class="play" id="pl">${ICON}</button>`;
  else if(q.type==='kd')stem=`<div class="big ku">${esc(w.ku)}</div>`;
  else if(q.type==='hoeren')stem=`<button class="play huge" id="pl">${ICON}</button>`;
  else stem=`<div class="big de">${esc(art(w).n)}</div><div class="sub">${esc(w.ku)}</div>`;
  let opts;
  if(q.type==='art')opts=`<div class="opts three">${q.opts.map(a=>`<button class="opt de" data-v="${a}"><span class="art-${a}">${a}</span></button>`).join('')}</div>`;
  else opts=`<div class="opts">${q.opts.map(j=>`<button class="opt ${q.type==='kd'?'de':''}" data-v="${j}">${q.type==='kd'?deHTML(W[j]):esc(W[j].ku)}</button>`).join('')}</div>`;
  app.innerHTML=`<div class="top"><button class="x" id="back">✕</button><div class="bar"><span style="width:${qi/Q.length*100}%"></span></div><div class="count de">${qi+1} / ${Q.length}</div></div>
  <div class="card q"><div class="qtype">${TYPE_LABEL[q.type]}</div>${stem}</div>${opts}<div class="fb" id="fb"></div><button class="next" id="nx" disabled>دواتر</button>`;
  app.querySelector('#back').onclick=home;
  const pl=app.querySelector('#pl');if(pl)pl.onclick=()=>play(q.i);
  if(q.type==='dk'||q.type==='hoeren')setTimeout(()=>play(q.i),250);
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b));
  app.querySelector('#nx').onclick=()=>{qi++;qi<Q.length?ask():result()};
  window.scrollTo(0,0);
}
function answer(b){
  const q=Q[qi],v=q.type==='art'?b.dataset.v:+b.dataset.v,ok=v===q.ans,w=W[q.i];
  app.querySelectorAll('.opt').forEach(o=>{o.disabled=true;const ov=q.type==='art'?o.dataset.v:+o.dataset.v;if(ov===q.ans)o.classList.add('ok');else if(o!==b)o.classList.add('dim')});
  if(!ok)b.classList.add('bad');
  if(ok)score++;else wrong.push(q.i);
  LOG.push({i:q.i,type:q.type,v,ok});
  if(q.type!=='dk')play(q.i);
  const fb=app.querySelector('#fb');
  fb.innerHTML=`<div class="fbbox ${ok?'ok':'bad'}">${ok?'ئافەرین، ڕاستە!':'نا، وەڵامی ڕاست ئەمەیە:'}<span class="de">${deHTML(w)}</span><span style="display:block;font-weight:400;color:var(--muted)">${esc(w.ku)}</span></div>`;
  const nx=app.querySelector('#nx');nx.disabled=false;if(qi===Q.length-1)nx.textContent='ئەنجام ببینە';
  app.querySelector('.bar span').style.width=((qi+1)/Q.length*100)+'%';
}
function result(){
  const pct=Math.round(score/Q.length*100);
  const best=store('dilan-best');if(best==null||pct>best)store('dilan-best',pct);
  const msg=pct>=90?'نایاب بوو، دیلان!':pct>=70?'زۆر باشە!':pct>=50?'باشە، بەردەوام بە!':'جارێکی تر هەوڵ بدەرەوە';
  const C=2*Math.PI*72,col=pct>=70?'var(--ok)':pct>=50?'#e0a800':'var(--bad)';
  const uniq=[...new Set(wrong)];
  app.innerHTML=`<div class="card res"><div class="ring"><svg width="170" height="170"><circle cx="85" cy="85" r="72" fill="none" stroke="#eee5d6" stroke-width="14"/><circle id="arc" cx="85" cy="85" r="72" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)"/></svg><div class="num de">${pct}%</div></div>
  <div class="msg">${msg}</div><div class="sub">${score} وەڵامی ڕاست لە ${Q.length} پرسیار</div></div>
  ${uniq.length?`<div class="card"><div class="label">ئەم وشانە دووبارە بکەرەوە</div>${uniq.map(i=>`<div class="row"><button class="play sm" data-p="${i}">${ICON}</button><div class="t"><div class="de">${deHTML(W[i])}</div><div class="ku">${esc(W[i].ku)}</div></div></div>`).join('')}</div>`:''}
  <div class="card send"><div class="label">ئەنجامەکە بۆ مامۆستا بنێرە</div><div class="sub" style="margin:0 0 12px">هەموو وەڵامەکانت، ڕاست و هەڵە، بۆ مامۆستا دەچن.</div>
  <div class="btns"><a class="share wa" id="wa" target="_blank" rel="noopener">ناردن بە واتسئاپ</a><a class="share tg" id="tg" target="_blank" rel="noopener">ناردن بە تێلیگرام</a><button class="ghost" id="cp">کۆپیکردنی ئەنجام</button></div><div class="sub" id="cpok" style="margin-top:8px"></div></div>
  <div class="btns">${uniq.length?'<button class="next" id="rw">تەنها هەڵەکان دووبارە بکەرەوە</button>':''}<button class="${uniq.length?'ghost':'next'}" id="ag">تاقیکردنەوەیەکی نوێ</button><button class="ghost" id="hm">گەڕانەوە بۆ سەرەتا</button></div>`;
  wireSend();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{document.getElementById('arc').style.strokeDashoffset=C*(1-pct/100)}));
  app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>play(+b.dataset.p));
  const rw=app.querySelector('#rw');if(rw)rw.onclick=()=>start(Q.mode==='art'?'art':Q.mode==='mix'?'mix':Q.mode,uniq);
  app.querySelector('#ag').onclick=()=>start(Q.mode);
  app.querySelector('#hm').onclick=home;
  window.scrollTo(0,0);
}
const MODE_NAME={mix:'تاقیکردنەوەی تێکەڵ',dk:'ئەڵمانی ← کوردی',kd:'کوردی ← ئەڵمانی',hoeren:'گوێگرتن',art:'der / die / das'};
function report(){
  const pct=Math.round(score/Q.length*100),d=new Date();
  const ds=d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' — '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const ans=(l)=>l.type==='art'?l.v:l.type==='kd'?W[l.v].de:W[l.v].ku;
  const right=(l)=>l.type==='art'?art(W[l.i]).a:l.type==='kd'?W[l.i].de:W[l.i].ku;
  let t='📘 ئەنجامی کوێزی دیلان\n'+'جۆر: '+MODE_NAME[Q.mode]+'\n'+'کات: '+ds+'\n'+'ئەنجام: '+score+' لە '+Q.length+' ('+pct+'%)\n';
  const bad=LOG.filter(l=>!l.ok),good=LOG.filter(l=>l.ok);
  if(bad.length){t+='\n❌ هەڵەکان:\n';bad.forEach((l,n)=>{t+='\n'+(n+1)+'. '+W[l.i].de+'\nوەڵامی دیلان: '+ans(l)+'\nوەڵامی ڕاست: '+right(l)+'\n'})}
  if(good.length){t+='\n✅ ڕاستەکان:\n'+good.map(l=>W[l.i].de).join('\n')+'\n'}
  return t;
}
function wireSend(){
  const t=report(),e=encodeURIComponent(t);
  const wa=document.getElementById('wa');if(!wa)return;
  const sc=app.querySelector('.send');if(sc&&app.children[1]!==sc)app.insertBefore(sc,app.children[1]);
  wa.href='https://wa.me/?text='+e;document.getElementById('tg').href='https://t.me/share/url?url='+encodeURIComponent(' ')+'&text='+e;
  document.getElementById('cp').onclick=async()=>{const ok=document.getElementById('cpok');
    try{await navigator.clipboard.writeText(t);ok.textContent='کۆپی کرا. ئێستا لە نامەیەکدا بۆ مامۆستای بنێرە.'}
    catch(err){ok.innerHTML='';const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='width:100%;height:160px;direction:rtl;font:inherit;margin-top:8px';ok.append('کۆپیکردن کاری نەکرد. دەقەکە لێرەیە، هەڵیبژێرە و کۆپی بکە:',ta);ta.select()}};
  try{const h=store('dilan-history')||[];h.push({d:Date.now(),m:Q.mode,s:score,n:Q.length});store('dilan-history',h.slice(-50))}catch(e){}
}
home();
</script>
